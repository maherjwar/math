name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project from zip
        run: |
          if [ ! -f geogebra-ar.zip ]; then
            echo "::error::لم يُعثر على الملف geogebra-ar.zip في جذر المستودع"
            exit 1
          fi
          rm -rf src && mkdir src
          unzip -q geogebra-ar.zip -d src

      - name: Build site
        run: |
          test -f src/index.html || { echo "::error::index.html غير موجود داخل الملف المضغوط"; exit 1; }
          rm -rf dist && mkdir dist
          cp -r src/. dist/
          touch dist/.nojekyll
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
